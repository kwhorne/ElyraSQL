name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test (nextest)
        run: cargo nextest run --workspace --no-fail-fast

  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Apple Silicon debuted with macOS 11. Keep C/assembly dependencies built
      # by ring and zstd at the same deployment floor as the Rust binary.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-apple-darwin

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Verify native Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          rustc -vV | grep -q '^host: aarch64-apple-darwin$'

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-1.88.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-arm64-cargo-1.88.0-

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked --target aarch64-apple-darwin

      - name: Test workspace (nextest)
        run: cargo nextest run --workspace --locked --target aarch64-apple-darwin --no-fail-fast

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-apple-darwin -p elyra-cli

      - name: Verify release binary
        run: |
          BIN=target/aarch64-apple-darwin/release/elyrasql
          test "$(lipo -archs "$BIN")" = "arm64"
          test "$(vtool -show-build "$BIN" | awk '/minos/ { print $2; exit }')" = "11.0"
          codesign --verify --strict "$BIN"
          "$BIN" version

  audit:
    name: security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Honours .cargo/audit.toml, where each ignored advisory is documented
      # with a reachability/format rationale.
      - name: Audit dependencies
        run: cargo audit

  compatibility:
    name: client & framework compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release -p elyra-cli

      - name: Start ElyraSQL server
        env:
          ELYRASQL_STMT_DESCRIBE: "on"
        run: |
          ./target/release/elyrasql serve --data /tmp/ci.edb --listen 127.0.0.1:3307 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # wait for the port to accept connections
          for _ in $(seq 1 100); do
            (echo > /dev/tcp/127.0.0.1/3307) >/dev/null 2>&1 && break
            sleep 0.2
          done

      - name: PyMySQL smoke (pure-Python driver, client-side binding)
        run: |
          python3 -m pip install --quiet PyMySQL
          ELYRASQL_PORT=3307 python3 tests/compat/python/pymysql_smoke.py

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql
          tools: composer

      - name: Laravel / Eloquent compatibility (PDO)
        working-directory: tests/compat/laravel
        run: |
          composer install --no-interaction --no-progress
          ELYRASQL_PORT=3307 ELYRASQL_DB=elyra php eloquent_test.php

      - name: Native (binary) prepared statements (PDO)
        run: ELYRASQL_PORT=3307 ELYRASQL_DB=elyra php tests/compat/php/native_prepare.php

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" || true
