name: Release

on:
  push:
    tags: ["v*"]
  # Build and publish an existing tag with this workflow as it is now: for a
  # tag whose release run failed, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.12.20"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the pushed one, or the one asked for by hand.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: aarch64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate release version
        run: |
          VERSION=${RELEASE_TAG#v}
          MANIFEST_VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          test "$VERSION" = "$MANIFEST_VERSION" || {
            echo "tag version $VERSION does not match Cargo.toml $MANIFEST_VERSION" >&2
            exit 1
          }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install MySQL client (macOS)
        if: matrix.platform == 'macos'
        # Only needed for PGO training, which is itself fail-safe -- so this
        # must never be able to fail a release on its own.
        continue-on-error: true
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mysql-client
          # mysql-client is keg-only, so it is not linked into /opt/homebrew/bin.
          # $GITHUB_PATH takes one directory per line and prepends it; writing a
          # whole PATH to $GITHUB_ENV instead fails with "Invalid format",
          # because $GITHUB_ENV wants KEY=value.
          echo "/opt/homebrew/opt/mysql-client/bin" >> "$GITHUB_PATH"

      # Before the PGO step: its instrumented build is a musl build too.
      - name: Install musl tools
        if: matrix.platform == 'linux'
        # ports.ubuntu.com (the arm64 mirror) has intermittent connectivity from
        # the arm64 runners, so retry the update+install a few times before giving
        # up rather than failing the whole release on a transient network blip.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y musl-tools; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "musl-tools install failed after retries" >&2
          exit 1

      - name: Generate PGO profile (fail-safe)
        id: pgo
        continue-on-error: true
        env:
          PGO_DIR: ${{ github.workspace }}/target/pgo
          # As the macOS build below sets it: the profile is used by a build
          # with the same flags.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'macos' && '11.0' || '' }}
        run: |
          rustup component add llvm-tools-preview
          # The training's Python benchmarks need pymysql. Without it each
          # one failed at its import, and every release since PGO came in
          # was trained on the SQL dumps alone; pgo-build.sh now stops
          # instead. A venv: the runners' system Pythons refuse a plain
          # `pip install` (PEP 668) on some images.
          python3 -m venv "$PGO_DIR/venv"
          "$PGO_DIR/venv/bin/pip" install --quiet pymysql
          export PATH="$PGO_DIR/venv/bin:$PATH"
          mkdir -p "$PGO_DIR/training-sql"
          python3 scripts/generate-training-sql.py --all --rows 50000 --output-dir "$PGO_DIR/training-sql"
          # The same --target as the build that uses the profile: without it
          # every symbol name differs (`-C metadata`) and ~11,000 functions
          # found no profile data, on every platform.
          ./scripts/pgo-build.sh --profile-only --target ${{ matrix.target }} --train-data-dir "$PGO_DIR/train-data"
          # Fail loudly if training produced no profile: continue-on-error then
          # turns this into a visible step failure and the warning step below
          # annotates the run instead of silently shipping a plain dist build.
          test -s "$PGO_DIR/merged.profdata"
          echo "RUSTFLAGS=-Cprofile-use=$PGO_DIR/merged.profdata -Cllvm-args=-pgo-warn-missing-function" >> "$GITHUB_ENV"

      - name: Warn when PGO was skipped
        if: steps.pgo.outcome == 'failure'
        run: |
          echo "::warning::PGO profile generation failed — releasing plain dist build WITHOUT profile-guided optimization"
          {
            echo "## PGO skipped"
            echo ""
            echo "Profile generation failed. This release ships a **plain dist build WITHOUT profile-guided optimization**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Note PGO success
        if: steps.pgo.outcome == 'success'
        run: |
          echo "PGO profile generated and applied to this release build." >> "$GITHUB_STEP_SUMMARY"

      - name: Build Linux static binary
        if: matrix.platform == 'linux'
        env:
          # jemalloc's C on aarch64-musl: GCC calls out to glibc's libgcc for
          # atomics, which needs `__getauxval` (not in musl); the link checks
          # fail and jemalloc refuses to build ("Don't have atomics").
          CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
        run: cargo build --profile dist --locked --target ${{ matrix.target }} -p elyra-cli

      - name: Build macOS binary
        if: matrix.platform == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --profile dist --locked --target ${{ matrix.target }} -p elyra-cli

      - name: Package
        run: |
          VERSION=${RELEASE_TAG#v}
          NAME=elyrasql-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}
          BIN=target/${{ matrix.target }}/dist/elyrasql
          mkdir -p "dist/$NAME"
          cp "$BIN" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            cp packaging/elyrasql.service "dist/$NAME/"
          else
            test "$(lipo -archs "$BIN")" = "arm64"
            test "$(vtool -show-build "$BIN" | awk '/minos/ { print $2; exit }')" = "11.0"
            codesign --verify --strict "$BIN"
          fi
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
          mkdir verify
          tar -C verify -xzf "$NAME.tar.gz"
          "verify/$NAME/elyrasql" version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            elyrasql-*.tar.gz
            elyrasql-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The release body used to be only the auto-generated compare link, so
      # everything written in CHANGELOG.md -- which is where the substance is --
      # never reached the release page. Extract this version's section instead.
      - name: Release notes from CHANGELOG
        run: |
          VERSION=${RELEASE_TAG#v}
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section for $VERSION" >&2
            exit 1
          fi
          wc -l RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/elyrasql-*.tar.gz
            artifacts/elyrasql-*.tar.gz.sha256
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          append_body: true
          generate_release_notes: true
