name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: aarch64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MANIFEST_VERSION=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          test "$VERSION" = "$MANIFEST_VERSION" || {
            echo "tag version $VERSION does not match Cargo.toml $MANIFEST_VERSION" >&2
            exit 1
          }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.platform == 'linux'
        # ports.ubuntu.com (the arm64 mirror) has intermittent connectivity from
        # the arm64 runners, so retry the update+install a few times before giving
        # up rather than failing the whole release on a transient network blip.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y musl-tools; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "musl-tools install failed after retries" >&2
          exit 1

      - name: Build Linux static binary
        if: matrix.platform == 'linux'
        run: cargo build --profile dist --locked --target ${{ matrix.target }} -p elyra-cli

      - name: Build macOS binary
        if: matrix.platform == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --profile dist --locked --target ${{ matrix.target }} -p elyra-cli

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NAME=elyrasql-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}
          BIN=target/${{ matrix.target }}/dist/elyrasql
          mkdir -p "dist/$NAME"
          cp "$BIN" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            cp packaging/elyrasql.service "dist/$NAME/"
          else
            test "$(lipo -archs "$BIN")" = "arm64"
            test "$(vtool -show-build "$BIN" | awk '/minos/ { print $2; exit }')" = "11.0"
            codesign --verify --strict "$BIN"
          fi
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
          mkdir verify
          tar -C verify -xzf "$NAME.tar.gz"
          "verify/$NAME/elyrasql" version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            elyrasql-*.tar.gz
            elyrasql-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The release body used to be only the auto-generated compare link, so
      # everything written in CHANGELOG.md -- which is where the substance is --
      # never reached the release page. Extract this version's section instead.
      - name: Release notes from CHANGELOG
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section for $VERSION" >&2
            exit 1
          fi
          wc -l RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/elyrasql-*.tar.gz
            artifacts/elyrasql-*.tar.gz.sha256
          body_path: RELEASE_NOTES.md
          append_body: true
          generate_release_notes: true
