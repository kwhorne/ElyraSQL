[workspace]
resolver = "2"
members = [
    "crates/elyra-core",
    "crates/elyra-storage",
    "crates/elyra-engine",
    "crates/elyra-embed",
    "crates/elyra-embed-capi",
    "crates/elyra-olap",
    "crates/elyra-vector",
    "crates/elyra-wire",
    "crates/elyra-server",
    "crates/elyra-cli",
]
# The cargo-fuzz crate uses the nightly toolchain + libfuzzer; keep it out of the
# normal (stable) workspace build.
exclude = ["fuzz", "testbench/sql-dump"]

[workspace.package]
version = "1.11.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Elyra"]
repository = "https://github.com/elyra/elyra-sql"
homepage = "https://elyra.dev"
description = "ElyraSQL — a robust server SQL database written in Rust"

[workspace.dependencies]
# Internal crates
elyra-core = { path = "crates/elyra-core" }
elyra-storage = { path = "crates/elyra-storage" }
elyra-engine = { path = "crates/elyra-engine" }
elyra-embed = { path = "crates/elyra-embed" }
elyra-embed-capi = { path = "crates/elyra-embed-capi" }
elyra-olap = { path = "crates/elyra-olap" }
elyra-vector = { path = "crates/elyra-vector" }
elyra-server = { path = "crates/elyra-server" }

# SQL frontend (shared parser)
sqlparser = { version = "0.53", features = ["visitor"] }

# Regular expressions (REGEXP / RLIKE)
regex = "1"

# Single-file ACID storage engine
redb = "2.2"
bincode = "1.3"

# Async runtime + MySQL wire protocol
tokio = { version = "1", features = ["full"] }
elyra-wire = { path = "crates/elyra-wire" }
async-trait = "0.1"

# Errors, logging, serialization
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Abort on panic rather than unwinding. A panic in a connection task used to
# unwind that task alone, leaving the process up -- but if it unwound while
# holding one of the std::sync::Mutex guards the server keeps (session state,
# cluster state, the metrics registry), that mutex stayed poisoned for the
# lifetime of the process and every later lock().unwrap() panicked in turn. The
# result was a server that still accepted connections and passed a health check
# while failing every query: the worst failure mode available. Aborting turns
# that into a clean crash, which is the path the crash-recovery and soak/chaos
# suites already exercise on every run, and which the shipped systemd unit
# (Restart=on-failure) and any container restart policy already handle.
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
